services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnemonis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mnemonis}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates mnemonis_test on first init only (existing volumes: run `CREATE DATABASE mnemonis_test;` manually).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
